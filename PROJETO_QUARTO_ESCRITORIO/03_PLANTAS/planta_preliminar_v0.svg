<text x="1182.5" y="350.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">• Hipótese A: armário 4,60 = largura interna total.</text>
<text x="1182.5" y="370.0" font-size="12" fill="#333" text-anchor="start" font-weight="normal">• Hipótese B: 0,30 + janela + 1,10 = Parede E.</text>
