<text x="950.0" y="310" font-size="15" font-weight="bold">ILUMINAÇÃO PROPOSTA (luz quente 2700–3000 K)</text>
<text x="950.0" y="332" font-size="12" fill="#333">Geral: ventilador c/ luz existente → lâmpada LED 3000 K</text>
<text x="950.0" y="350" font-size="12" fill="#333">L1  Fita COB 24 V sob a prateleira — tarefa/ambiente</text>
<text x="950.0" y="368" font-size="12" fill="#333">L2  Fita COB em perfil vertical no ripado — decorativa</text>
<text x="950.0" y="386" font-size="12" fill="#333">L3  Barra de luz no monitor — tarefa, sem reflexo na tela</text>
<text x="950.0" y="404" font-size="12" fill="#333">L4  Arandela articulada na cabeceira — leitura</text>
<text x="950.0" y="422" font-size="12" fill="#333">L5  Fita COB nos 3 nichos (0,72 m), mesma fonte 24 V</text>
<text x="950.0" y="440" font-size="12" fill="#333">L6  Luminária de mesa 2700 K — plugue no filtro</text>
<text x="950.0" y="458" font-size="12" fill="#333">F   Filtro c/ DPS + fonte 24 V presos sob o tampo</text>
<text x="950.0" y="476" font-size="12" fill="#333">L1 + L2 + L5 dimerizáveis por controle Wi-Fi</text>
<text x="950.0" y="494" font-size="12" fill="#333">Fonte 24 V: 5,3 m × 16 W/m ≈ 85 W (fonte de 120 W)</text>
<text x="950.0" y="522" font-size="15" font-weight="bold">ALIMENTAÇÃO (sem pontos novos)</text>
<text x="950.0" y="544" font-size="12" fill="#333">Tomada Parede D → filtro c/ DPS → PC, monitores, fonte LED</text>
<text x="950.0" y="562" font-size="12" fill="#333">Tomada Parede E → arandela + carregador da cama</text>
<text x="950.0" y="580" font-size="12" fill="#333">Tomada D recebe prolongador de caixa (ripado de 3 cm)</text>
<text x="950.0" y="598" font-size="12" fill="#c0392b" font-weight="bold">⚠ Conferir com eletricista: circuito e bitola da</text>
<text x="950.0" y="616" font-size="12" fill="#333">   tomada D (PC + 2 monitores + LED ≈ 600–900 W)</text>
<text x="950.0" y="634" font-size="12" fill="#c0392b" font-weight="bold">⚠ Fonte 24 V sempre ventilada e acessível</text>
